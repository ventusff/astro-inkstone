server {
    listen 80;
    # Both stacks: alpine's wget resolves `localhost` to ::1, so an
    # IPv4-only listener answers the container's own health probe with
    # ECONNREFUSED — which reads as a dead service and takes the container
    # out of the reverse proxy's rotation.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro is built with trailingSlash:'ignore' and emits <page>/index.html,
    # so a request without the slash has to find the directory.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Pagefind's index and the hashed assets are immutable per build.
    location ~* \.(js|css|woff2?|svg|png|jpg|webp|pf_meta|pf_index|pf_fragment)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # A health probe that does not depend on any page's content.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
