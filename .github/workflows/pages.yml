name: Deploy demo to GitHub Pages

# Builds the demo (the package's own manual, written with the package itself)
# and publishes it to GitHub Pages. The engine submodule is a public repo, so
# an anonymous checkout is all it takes.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Guard: only the canonical repo deploys Pages (forks/mirrors skip cleanly).
    if: github.repository == 'ventusff/astro-inkstone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package deps (repo root)
        # The demo consumes the package via `file:..`; the package's own
        # dependencies are provided by this repo-root install.
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Install, check & build demo
        working-directory: demo
        env:
          DEMO_SITE: https://ventusff.github.io
          DEMO_BASE: /astro-inkstone/
          # the Pages demo ships the browser-local playground (visitor edits
          # stay in their own IndexedDB); postbuild declares the shape via
          # check-dist --playground
          PLAYGROUND: '1'
        run: |
          npm ci --no-audit --no-fund
          npx astro check
          npm run build
          npm run check
      - name: Render-layer and playground probes on the production-base artifact
        # the artifact is built for the /astro-inkstone/ mount: probing it
        # requires serving it AT that prefix, exactly as Pages mounts it; the
        # playground probe drives the browser-local editor end to end there
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p probe-root/astro-inkstone
          cp -r dist/. probe-root/astro-inkstone/
          node ../scripts/ui_probe.mjs probe-root
          node ../scripts/playground_probe.mjs probe-root /astro-inkstone/
        working-directory: demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    if: github.repository == 'ventusff/astro-inkstone'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
