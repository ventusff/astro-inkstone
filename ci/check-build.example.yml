name: check-build (example)

# Example pre-deploy gate for a consuming site: actually run
# `astro check` + `astro build` + the engine's dist checker on every push.
#
# Why: some sites run their production editor as a long-lived dev server
# (compile-on-demand), where a broken change surfaces only when someone opens
# the page. This gate catches it before merge instead.
#
# Sites that keep content in a separate repository (so CI never checks out
# the real content) feed content collections with a minimal fixture tree —
# keep ci/fixtures/ in the same repo and the same PR as the site code, so
# drift turns red immediately.

on:
  push:
    branches: [main]

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # fetches the vendored astro-inkstone / astro-inkbrush checkouts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      # Content fixtures (only for sites whose content lives in another repo):
      # - run: mkdir -p src/content && cp -r ci/fixtures/notes src/content/notes
      # Type checking must be its own step: `astro build` transpiles with
      # esbuild and never looks at types.
      - run: npx astro check
      - run: npx astro build
      # Dist checks ship with the engine: internal links resolve, no dangling
      # anchors, no KaTeX error residue, etc.
      - run: node <path-to-astro-inkbrush-checkout>/scripts/check-dist.mjs dist
