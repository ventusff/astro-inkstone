name: CI

# The package's gate: unit tests for the library, a type check and a build of
# the demo (with the engine's dist check), then the two render-layer probes
# over the output — ui_probe (layout and markup defects at four viewport
# widths) and contrast_probe (WCAG contrast of rendered text, both themes).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package deps (repo root)
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Install, type-check and build the demo
        working-directory: demo
        run: |
          npm ci --no-audit --no-fund
          npx astro check
          npm run build
      - name: Render-layer probe
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/ui_probe.mjs demo/dist
      - name: Contrast probe
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/contrast_probe.mjs demo/dist
