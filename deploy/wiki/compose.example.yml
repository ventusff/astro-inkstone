# Compose (production): the EDITING machine — a permanent
# `WIKI=1 astro dev` container carrying the astro-inkbrush CMS.
#
# Two deployments serve the same repo, and they are deliberately different:
#   deploy/static/compose.example.yml  the static nginx bundle at your
#     reader-facing domain
#   deploy/wiki/compose.example.yml    this one — the CMS, on its own subdomain
#
# The subdomain is not cosmetic: inkbrush mounts its API at the SERVER ROOT
# (/api/wiki/*), independent of SITE_BASE, and on a shared apex host that
# root path may already belong to another service. Editing therefore lives at
# a dedicated editing subdomain (dev servers must never share the reader path).
services:
  site-wiki:
    build:
      context: ../..
      dockerfile: deploy/wiki/Dockerfile
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:?your site repo, e.g. git@github.com:you/your-site.git}
      WIKI: '1'
      SITE_BASE: ${SITE_BASE:-/}
      SITE_HOST: ${SITE_HOST:?e.g. edit.your-site.com}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${SITE_HOST:?}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-wiki-editor}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-wiki@example.com}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # The CMS config and the bot SSH key arrive base64-encoded in the
      # service environment — not through a panel-managed file-mount feature,
      # whose storage semantics vary by platform and can silently resolve to
      # nothing (or worse, to a regular file where a directory was expected,
      # failing every later bind with ENOTDIR). The entrypoint decodes both
      # to disk on boot instead.
      INKBRUSH_CONFIG_B64: ${INKBRUSH_CONFIG_B64:-}
      BOT_SSH_KEY_B64: ${BOT_SSH_KEY_B64:-}
      # The IdP's SAML signing certificate (public material, not a secret).
      # inkbrush requires it to be a readable file on disk, otherwise the
      # provider reports unconfigured and the login button is dead.
      SAML_IDP_CERT_B64: ${SAML_IDP_CERT_B64:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TZ: ${TZ:-UTC}
    expose:
      - '4321'
    networks:
      - proxy
    volumes:
      - site_repo:/repo
networks:
  # attach to your reverse-proxy network
  proxy:
    external: true
volumes:
  site_repo:
