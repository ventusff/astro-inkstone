# Compose (production): the static reader-facing site.
# Route your domain (or a path prefix) to this container's :80.
# A plain static build — no CMS, no mounted credentials, no persistent
# volume. Redeploying rebuilds from the repo.
services:
  site-static:
    build:
      context: ../..
      dockerfile: deploy/static/Dockerfile
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - proxy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  # attach to your reverse-proxy network
  proxy:
    external: true
