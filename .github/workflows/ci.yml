name: CI

# The package's gate: unit tests for the library, a type check and a build of
# the demo (with the engine's dist check), then ui_probe over the output
# (layout and markup defects at four viewport widths). contrast_probe (WCAG
# contrast of rendered text, both themes) samples pixels page by page and is
# far too slow for every push at the demo's size — it stays the LOCAL gate
# before any style commit, and runs here only on manual dispatch with the
# `contrast` input set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      contrast:
        description: 'also run the contrast probe (slow: pixel-samples every page in both themes)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-probe:
    # Guard: the canonical repo runs CI; a mirror absorbing this tree does not.
    if: github.repository == 'ventusff/astro-inkstone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package deps (repo root)
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Install, type-check and build the demo
        working-directory: demo
        run: |
          npm ci --no-audit --no-fund
          npx astro check
          npm run build
      - name: Content check (dialect + guard + math)
        working-directory: demo
        run: node vendor/astro-inkbrush/scripts/check-content.mjs src/content/notes --math
      - name: Wikilink check (strict, locale table from the site registry)
        working-directory: demo
        run: node scripts/check-links.mjs
      - name: Render-layer probe
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/ui_probe.mjs demo/dist
      - name: Contrast probe (manual dispatch only — the local pre-commit gate otherwise)
        if: github.event_name == 'workflow_dispatch' && inputs.contrast
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/contrast_probe.mjs demo/dist
